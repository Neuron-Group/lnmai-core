[package]
name = "lnmai-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70.0"
description = "LnmaiCore - Verified game judgment runtime for maimai rhythm game"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "lnmai_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.0"
rand = "0.8"

[features]
default = []
aeneas = []  # Enable Aeneas-compatible mode

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true
